limit_req_zone $binary_remote_addr zone=atc_api_per_ip:10m rate=20r/s;
log_format atc_safe '$remote_addr "$request_method $uri"';

# Production pins the private app network to this subnet. Only the Caddy edge
# can reach Nginx from it, so an arbitrary public X-Forwarded-For is never
# trusted. Direct local-development connections are unaffected.
set_real_ip_from 172.31.10.0/24;
set_real_ip_from 172.31.20.0/24;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $request_uri $atc_access_loggable {
  default 1;
  ~^/api/(?:quotes|v1/public-quote-drafts)/[^/]+/(?:pdf|xlsx)(?:\?|$) 0;
  ~^/login/callback(?:\?|$) 0;
}

map "$uri:$status" $atc_cache_control {
  default "no-store, no-cache, must-revalidate";
  ~^/assets/.*:(200|206|304)$ "public, max-age=31536000, immutable";
  ~^/api/ "";
  ~^/healthz: "";
}

map $http_x_forwarded_proto $atc_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /dev/stdout atc_safe if=$atc_access_loggable;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    client_max_body_size 260m;
    client_body_timeout 3600s;
    limit_req zone=atc_api_per_ip burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 30s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $atc_forwarded_proto;
  }

  location ^~ /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Cache-Control $atc_cache_control always;
}
