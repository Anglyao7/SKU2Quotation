name: AI Trade Cloud CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-and-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-bookworm
        env:
          POSTGRES_DB: ai_trade_cloud
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_trade_cloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ATC_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:postgres-ci-admin@127.0.0.1:5432/ai_trade_cloud
      ATC_POSTGRES_OWNER_URL: postgresql+psycopg://atc_migration:migration-ci-only@127.0.0.1:5432/ai_trade_cloud
      ATC_POSTGRES_APP_URL: postgresql+psycopg://atc_app:app-ci-only@127.0.0.1:5432/ai_trade_cloud
      ATC_POSTGRES_AUTH_URL: postgresql+psycopg://atc_auth:auth-ci-only@127.0.0.1:5432/ai_trade_cloud
      ATC_POSTGRES_WORKER_URL: postgresql+psycopg://atc_worker:worker-ci-only@127.0.0.1:5432/ai_trade_cloud
      ATC_MIGRATION_DB_PASSWORD: migration-ci-only
      ATC_APP_DB_PASSWORD: app-ci-only
      ATC_AUTH_DB_PASSWORD: auth-ci-only
      ATC_WORKER_DB_PASSWORD: worker-ci-only
      AUTH_JWT_SECRET: ci-jwt-secret-at-least-thirty-two-bytes
      AUTH_TOKEN_PEPPER: ci-token-pepper-at-least-thirty-two-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        working-directory: apps/api
        run: python -m pip install --requirement requirements.txt
      - name: Bootstrap PostgreSQL roles
        working-directory: apps/api
        run: python -m scripts.bootstrap_postgres_roles
      - name: Verify migration reversibility
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.ATC_POSTGRES_OWNER_URL }}
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Grant runtime roles and seed SaaS foundation
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.ATC_POSTGRES_OWNER_URL }}
        run: |
          python -m scripts.grant_runtime_roles
          python -m scripts.seed_phase1
      - name: Run API, architecture, and PostgreSQL tenant tests
        working-directory: apps/api
        run: pytest -q
      - name: Verify trusted auth database boundary
        working-directory: apps/api
        run: python -m scripts.verify_postgres_auth_context

  web-and-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install and verify web
        working-directory: apps/web
        run: |
          npm ci
          npm run lint --if-present
          npm run build
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build immutable workload images
        run: |
          docker build --target api --build-arg ATC_COMMIT_SHA=${GITHUB_SHA} --tag atc-api:${GITHUB_SHA} -f apps/api/Dockerfile .
          docker build --target worker --build-arg ATC_COMMIT_SHA=${GITHUB_SHA} --tag atc-worker:${GITHUB_SHA} -f apps/api/Dockerfile .
          docker build --build-arg VITE_API_BASE_URL=/ --build-arg ATC_COMMIT_SHA=${GITHUB_SHA} --tag atc-web:${GITHUB_SHA} apps/web
